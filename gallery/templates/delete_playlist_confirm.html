{% extends 'base.html' %}
{% block title %}Delete Playlist — Vinylite{% endblock %}
{% block content %}
<div class="form-page">
  <a href="{% url 'gallery:playlist_detail' playlist.id %}" class="back-link">&larr; Back to {{ playlist.name }}</a>
  <div class="form-card">
    <span class="eyebrow">Are you sure?</span>
    <h1>Delete "{{ playlist.name }}"?</h1>
    <p class="poster-sub" style="margin-bottom:26px;">This can't be undone. The songs themselves stay in the gallery.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary" style="width:100%;">Yes, Delete Playlist</button>
    </form>
  </div>
</div>
{% endblock %}
